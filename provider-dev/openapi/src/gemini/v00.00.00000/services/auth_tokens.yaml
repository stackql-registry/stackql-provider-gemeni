            - ASPECT_RATIO_TWENTY_ONE_BY_NINE
            - ASPECT_RATIO_ONE_BY_EIGHT
            - ASPECT_RATIO_EIGHT_BY_ONE
            - ASPECT_RATIO_ONE_BY_FOUR
            - ASPECT_RATIO_FOUR_BY_ONE
          enumDescriptions:
            - Default value. This value is unused.
