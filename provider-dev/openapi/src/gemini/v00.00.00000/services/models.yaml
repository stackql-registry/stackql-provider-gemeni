            - ASPECT_RATIO_FOUR_BY_THREE
            - ASPECT_RATIO_FOUR_BY_FIVE
            - ASPECT_RATIO_FIVE_BY_FOUR
            - ASPECT_RATIO_NINE_BY_SIXTEEN
