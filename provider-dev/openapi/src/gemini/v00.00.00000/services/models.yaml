      type: object
      properties:
        output:
          description: Required. An example of what the model should output given the input.
          $ref: "#/components/schemas/Message"
        input:
          description: Required. An example of an input `Message` from the user.
          $ref: "#/components/schemas/Message"
    InputConfig:
      type: object
      properties:
        fileName:
