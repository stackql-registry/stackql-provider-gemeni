        web:
          description: Grounding chunk from the web.
          $ref: "#/components/schemas/Web"
        maps:
          description: Optional. Grounding chunk from Google Maps.
          $ref: "#/components/schemas/Maps"
    RetrievalMetadata:
      type: object
      properties:
